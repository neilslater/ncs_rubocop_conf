name: CI

on:
  push:
    branches:
      - main
      - maintenance
  pull_request:
  schedule:
    - cron: '0 6 11 * *'
  
permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: Gemfile.lock
          bundler-cache: true

      - name: Run coverage, policy fixtures, lint, audits, and documentation checks
        run: bundle exec rake

      - name: Check installed package and consumer integration
        if: matrix.ruby == '4.0'
        run: bundle exec rake package_check
