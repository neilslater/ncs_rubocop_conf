AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3

Metrics/BlockLength:
  CountAsOne:
    - array
    - hash

Metrics/ClassLength:
  CountAsOne:
    - array
    - hash

Metrics/MethodLength:
  CountAsOne:
    - array
    - hash

Metrics/ModuleLength:
  CountAsOne:
    - array
    - hash

Metrics/ParameterLists:
  CountKeywordArgs: false
